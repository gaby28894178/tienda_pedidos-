<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Store building -->
  <rect x="3" y="10" width="18" height="12" rx="1" fill="#4f46e5" stroke="#4f46e5"/>
  <!-- Store front -->
  <rect x="5" y="12" width="14" height="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1"/>
  <!-- Door -->
  <rect x="10" y="15" width="4" height="5" fill="#4f46e5"/>
  <!-- Door handle -->
  <circle cx="12.5" cy="17.5" r="0.3" fill="#ffffff"/>
  <!-- Windows -->
  <rect x="6" y="13" width="2.5" height="1.5" fill="#4f46e5"/>
  <rect x="15.5" y="13" width="2.5" height="1.5" fill="#4f46e5"/>
  <!-- Awning -->
  <path d="M2 10 L22 10 L20 8 L4 8 Z" fill="#ef4444" stroke="#dc2626"/>
  <!-- Awning stripes -->
  <line x1="6" y1="8" x2="6" y2="10" stroke="#ffffff" stroke-width="0.5"/>
  <line x1="10" y1="8" x2="10" y2="10" stroke="#ffffff" stroke-width="0.5"/>
  <line x1="14" y1="8" x2="14" y2="10" stroke="#ffffff" stroke-width="0.5"/>
  <line x1="18" y1="8" x2="18" y2="10" stroke="#ffffff" stroke-width="0.5"/>
  <!-- Store sign -->
  <rect x="8" y="4" width="8" height="3" rx="0.5" fill="#10b981" stroke="#059669"/>
  <text x="12" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="1.5" fill="#ffffff" font-weight="bold">SHOP</text>
</svg>
